openapi: 3.0.3
info:
  title: Prices API
  description: >-
    Inditex price lookup service. Given a brand, a product and an application
    date, it returns the highest-priority price list that applies.
  version: "1.0.0"
tags:
  - name: Prices
    description: Applicable price lookup
paths:
  /prices:
    get:
      tags:
        - Prices
      operationId: getApplicablePrice
      summary: Gets the applicable price for a product, a brand and an application date.
      parameters:
        - name: applicationDate
          in: query
          required: true
          description: Application date and time, in ISO-8601 format without a time-zone offset.
          schema:
            type: string
            format: date-time
          example: "2020-06-14T10:00:00"
        - name: productId
          in: query
          required: true
          description: Product identifier.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 35455
        - name: brandId
          in: query
          required: true
          description: Brand identifier.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      responses:
        "200":
          description: Applicable price found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceResponse"
        "400":
          description: The request parameters are not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No applicable price was found for the given criteria.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    PriceResponse:
      type: object
      description: Price applicable to a brand's product on a given date.
      required:
        - productId
        - brandId
        - priceList
        - startDate
        - endDate
        - price
        - currency
      properties:
        productId:
          type: integer
          format: int64
        brandId:
          type: integer
          format: int64
        priceList:
          type: integer
          format: int64
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        price:
          type: number
        currency:
          type: string
    ErrorResponse:
      type: object
      description: API error detail.
      required:
        - status
        - error
        - message
        - path
        - timestamp
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        timestamp:
          type: string
          format: date-time
